<!doctype html>
<html lang="en" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f8fa">
	<title>Skifall Speedruns</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
	<main class="container page-shell">
		<header class="page-header">
			<h1>SKIFALL</h1>
			<p class="subtitle">WORLD 1 SPEEDRUN</p>

			<div class="summary" aria-label="Leaderboard summary">
				<span><em>RUNNERS</em><strong id="profile-count">—</strong></span>
				<span><em>FULL RUNS</em><strong id="full-run-count">—</strong></span>
				<span><em>CR:</em><strong id="fastest-full-run">—</strong></span>
			</div>
		</header>

		<section class="leaderboard" aria-label="World 1 speedrun leaderboard">
			<div class="toolbar">
				<input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="SEARCH RUNNER" aria-label="Search runners">
				<div class="refresh-group">
					<button id="refresh-button" type="button">REFRESH</button>
					<small id="updated-label">LOADING...</small>
				</div>
			</div>

			<div id="status" class="status" role="status"></div>

			<div class="table-wrap" role="region" aria-label="Leaderboard table" tabindex="0">
				<table>
					<thead>
						<tr>
							<th class="runner-column" scope="col"><button class="sort-button" data-key="name" type="button">RUNNER</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l1" type="button">W1L1</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l2" type="button">W1L2</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l3" type="button">W1L3</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l4" type="button">W1L4</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l5" type="button">W1L5</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l6" type="button">W1L6</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l7" type="button">W1L7</button></th>
							<th scope="col"><button class="sort-button" data-key="w1l8" type="button">W1L8</button></th>
							<th class="total-column current-total-column" scope="col"><button class="sort-button" data-key="current_total" type="button">CURRENT TOTAL<br><span>(MORE LEVELS TO COMPLETE)</span></button></th>
							<th class="total-column" scope="col"><button class="sort-button active" data-key="all_levels_total" type="button">FULL GAME</button></th>
						</tr>
					</thead>
					<tbody id="leaderboard-body"></tbody>
				</table>
			</div>

			<p class="legend">GOLD = CURRENT FULL GAME RECORD</p>
		</section>
	</main>

	<script src="app.js?v=15"></script>
</body>
</html>
